spring.application.name=proyectofinal

# Puerto del servidor
server.port=${SERVER_PORT:8090}

# Conexión a PostgreSQL (Neon). Definir DB_URL, DB_USERNAME y DB_PASSWORD en el entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-raspy-field-b5rcv2mt-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_uc6KtsCDU2ab}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Configuración JSON flexible para clientes REST (Thunder Client / Postman)
spring.jackson.deserialization.fail-on-unknown-properties=false

# Google OAuth
