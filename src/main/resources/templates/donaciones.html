<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <title>Document</title>
</head>
<body class="bg-light">
    
    <!-- Barra de Navegación -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-dark bg-primary shadow-sm" style="padding: 15px 20px;">
            <div class="container-fluid px-lg-5">
                <a th:href="@{/kallpa-solidary}" class="text-decoration-none">
                    <h1 class="text-white fw-bold mb-0 fs-3">Kallpa Solidary</h1>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav gap-3 ms-auto align-items-center mt-3 mt-lg-0 text-center">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold" th:href="@{/campanas#campaigns}">Campañas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold" th:href="@{/campanas#events}">Eventos</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold" th:href="@{/sobre-nosotros}">Sobre Nosotros</a>
                        </li>
                        
                        <!-- Menú Gestión (Con IDs independientes para evitar conflictos) -->
                        <li class="nav-item dropdown" th:if="${esAdmin}">
                            <a class="nav-link active text-white dropdown-toggle fw-semibold" id="navbarDropdownGestion" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Gestión
                            </a>
                            <ul class="dropdown-menu text-center shadow border-0" aria-labelledby="navbarDropdownGestion">
                                <li><a class="dropdown-item fw-semibold fs-6 py-2" th:href="@{/solicitudes}">Solicitudes</a></li>
                                <li><a class="dropdown-item fw-semibold fs-6 py-2" th:href="@{/donaciones}">Recepción de Donaciones</a></li>
                                <li><a class="dropdown-item fw-semibold fs-6 py-2" th:href="@{/reportes}">Reportes</a></li>
                            </ul>
                        </li>

                        <!-- Se muestra SOLO si el usuario NO ha iniciado sesión -->
                        <li class="nav-item w-100 w-lg-auto me-lg-2 mb-2 mb-lg-0" sec:authorize="isAnonymous()">
                            <a class="btn btn-outline-light text-nowrap rounded-pill px-4 fw-semibold shadow-sm w-100" th:href="@{/login}">Iniciar Sesión</a>
                        </li>

                        <li class="nav-item w-100 w-lg-auto" sec:authorize="isAnonymous()">
                            <a class="btn btn-dark text-white text-nowrap rounded-pill px-4 fw-bold shadow w-100" th:href="@{/registro}">Registrarse</a>
                        </li>

                        <!-- Se muestra SOLO si el usuario SÍ ha iniciado sesión -->
                        <li class="nav-item text-white w-100 w-lg-auto d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                            <span class="text-white fw-bold">¡Hola, <span th:text="${nombreUsuario}">Usuario</span>!</span>
                            
                            <!-- Botón de cerrar sesión (Spring Security intercepta el POST a /logout por defecto) -->
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-danger text-white fw-semibold px-3">Cerrar Sesión</button>
                            </form>
                        </li>
                    </ul>  
                </div>     
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5">
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h2 class="text-dark fw-bold mb-1"><i class="fas fa-boxes text-info me-2"></i> Recepción y Trazabilidad de Donaciones</h2>
            </div>
        </div>

        <!-- Tarjeta contenedora con sombra -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 bg-white">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark text-uppercase fs-7">
                            <tr>
                                <th class="py-3">ID</th>
                                <th class="py-3">Código de Lote</th>
                                <th class="py-3">Donante</th>
                                <th class="py-3">Producto</th>
                                <th class="py-3">Cantidad</th>
                                <th class="py-3">Estado</th>
                                <th class="py-3">Fecha de Ingreso</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-donaciones">
                            <!-- Los registros se inyectarán dinámicamente mediante JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts de Bootstrap y lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/JS/donaciones.js"></script>
</body>
</html>
