<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Kallpa Solidary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg border-bottom border-info bg-info fixed-top" style="padding: 30px;">
            <div class="container-fluid px-4">
                <h1 class="Titulo text-white fw-bold">Kallpa Solidary</h1>

                <ul class="navbar-nav gap-3 d-flex flex-row">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="home.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="#">Campañas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="#">Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="#">Donaciones</a>
                    </li>


                    <li class="nav-item dropdown">
                        <a class="nav-link active text-white dropdown-toggle fw-semibold" aria-current="page"
                            id="navbarDropdown" role="button" data-bs-toggle="dropdown">Conocenos
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item fw-semibold fs-6 py-2" href="SobreNosotros.html">Sobre
                                    Nosotros</a></li>
                            <li><a class="dropdown-item fw-semibold fs-6 py-2" href="#">Reportes</a></li>
                        </ul>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-black fw-bold" href="login.html">Iniciar Sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-danger text-white" href="registro.html">Registrarse</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="background"></div>
    
    <div class="container">
        <p class="fs-1 text-white p-3 fw-bold rounded">Crear cuenta</p>

        <form action="/login" method="POST">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ingrese su nombre">

            <label for="reg-email">Correo</label>
            <input type="email" id="reg-email" placeholder="Ingrese su correo">

            <label for="reg-pass">Contraseña</label>
            <input type="password" id="reg-pass" placeholder="Ingrese su contraseña">

            <label for="confirmar-pass">Confirmar contraseña</label>
            <input type="password" id="confirmar-pass" placeholder="Repita su contraseña">

            <button type="submit" class="btn btn-primary">
                Registrarse
            </button>

            <p class="text-black mt-3 fs-6">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
</body>
</body>
</html>
