<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Kallpa Solidary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
            <nav class="navbar border-bottom border-dark bg-info" style="padding: 20px;">
                <div class="px-lg-5">
                    <a href="home.html" class="text-decoration-none"><h1 class="text-white fw-bold">Kallpa Solidary</h1></a>
                </div>

                <ul class="navbar-nav gap-3 d-flex flex-row me-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="#">Campañas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="#">Eventos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="#">Donaciones</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="#">Sobre Nosotros</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="#">Reportes</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="btn btn-secondary text-white fw-bold" href="login.html">Iniciar Sesión</a>
                    </li>
                </ul>       
            </nav>      
        </header>

    <div class="background"></div>
    
    <div class="container">
        <p class="fs-1 text-white p-3 fw-bold rounded">Crear cuenta</p>

        <form action="/login" method="POST">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ingrese su nombre">

            <label for="reg-email">Correo</label>
            <input type="email" id="reg-email" placeholder="Ingrese su correo">

            <label for="reg-pass">Contraseña</label>
            <input type="password" id="reg-pass" placeholder="Ingrese su contraseña">

            <label for="confirmar-pass">Confirmar contraseña</label>
            <input type="password" id="confirmar-pass" placeholder="Repita su contraseña">

            <button type="submit" class="btn btn-primary">
                Registrarse
            </button>

            <p class="text-black mt-3 fs-6">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
</body>
</body>
</html>
