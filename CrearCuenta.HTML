<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="EstiloCuenta.css">
</head>
<body>
    <h2>Crear una cuenta</h2>
    <fieldset>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ingrese su nombre">

            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="Ingrese su correo">

            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" placeholder="Ingrese su contraseña">

            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" placeholder="Repita su contraseña">

            <button type="submit">Registrarse</button>
        
        </fieldset>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
</body>
</body>
</html>
